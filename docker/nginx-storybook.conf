server {
    listen 6006;
    listen [::]:6006;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static Storybook (manager + iframe). Fallback keeps deep links usable.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted assets; keep HTML fresh for redeploys.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
